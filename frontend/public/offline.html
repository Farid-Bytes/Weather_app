<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATMOS — Offline</title>
  <style>
    body {
      font-family: Poppins, system-ui, sans-serif;
      background: #0b1223;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: white;
      text-align: center;
      margin: 0;
    }
    .card {
      background: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2rem;
      max-width: 400px;
    }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ATMOS</h1>
    <p>You’re offline. Weather data needs a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
